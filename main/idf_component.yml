## IDF Component Manager Manifest File
dependencies:
  lvgl/lvgl:
    version: ^9.*
    public: true
  # Used directly: libpng streams the browser admin's screenshot, zlib inflates gzipped ADS-B
  # responses. Both also arrive transitively through the LVGL adapter's image decoder, but this
  # firmware calls them itself, so they are declared here rather than relied on second-hand.
  espressif/libpng: ^1
  espressif/zlib: ^1
